name: Build Block2Box

# Se declenche a chaque push/PR sur main, et manuellement via l'onglet Actions.
# Un tag "v*" (ex: v1.0.0) declenche en plus la creation d'une Release GitHub avec le jar attache.
#
# Particularite de ce workflow : le code source n'est PAS commite fichier par fichier,
# il reste sous forme d'une archive "Block2Box.zip" a la racine du depot. C'est GitHub
# Actions (donc les serveurs de GitHub, pas ton ordinateur) qui la dezippe avant de
# compiler avec Maven.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # necessaire pour que le job puisse publier une Release GitHub

jobs:
  build:
    name: Build (Maven / JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Dezipper l'archive et localiser le projet
        id: locate
        run: |
          echo "Contenu de la racine du depot :"
          ls -la

          # Dezippe en boucle tout .zip trouve a la racine (gere aussi un zip
          # imbrique dans un autre), jusqu'a trouver un pom.xml quelque part.
          for i in 1 2 3 4 5; do
            POM="$(find . -not -path './.git/*' -name pom.xml | head -n1)"
            if [ -n "$POM" ]; then
              break
            fi
            ZIP_FILE="$(find . -maxdepth 1 -iname '*.zip' | head -n1)"
            if [ -z "$ZIP_FILE" ]; then
              break
            fi
            echo "Decompression de : $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d .
            rm -f "$ZIP_FILE"
          done

          POM="$(find . -not -path './.git/*' -name pom.xml | head -n1)"
          if [ -z "$POM" ]; then
            echo "Erreur : aucun pom.xml trouve apres decompression. Contenu obtenu :"
            find . -maxdepth 3 -not -path './.git*'
            exit 1
          fi

          PROJECT_DIR="$(dirname "$POM")"
          echo "Projet Maven trouve dans : $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Installer le JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ steps.locate.outputs.dir }}/pom.xml

      - name: Compiler avec Maven
        working-directory: ${{ steps.locate.outputs.dir }}
        run: mvn -B clean package --no-transfer-progress

      - name: Recuperer le nom du jar genere
        id: jar
        working-directory: ${{ steps.locate.outputs.dir }}
        run: echo "path=${{ steps.locate.outputs.dir }}/$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Publier le jar comme artifact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: Block2Box
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Creer une Release GitHub (uniquement sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
